<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ius et Veritas – 36 Aniversario</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif;
      background-color: #0d0d1a;
      color: #f0e6cc;
    }

    /* ── HERO ── */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d0d1a 0%, #1a1a3e 50%, #0d0d1a 100%);
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .hero-label {
      font-size: 0.95rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 1rem;
    }

    .hero-title {
      font-size: clamp(3.5rem, 10vw, 8rem);
      font-weight: bold;
      letter-spacing: 0.08em;
      color: #c9a84c;
      text-shadow: 0 0 40px rgba(201,168,76,0.4);
      line-height: 1;
    }

    .hero-title span {
      display: block;
      font-size: clamp(1.8rem, 4vw, 3rem);
      color: #f0e6cc;
      letter-spacing: 0.2em;
      margin-top: 0.6rem;
      font-weight: normal;
    }

    .hero-subtitle {
      margin-top: 1.8rem;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #a08040;
    }

    .divider {
      width: 80px;
      height: 2px;
      background: #c9a84c;
      margin: 2rem auto 0;
    }

    /* ── SECTIONS ── */
    section {
      padding: 5rem 2rem;
    }

    .section-title {
      text-align: center;
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 0.5rem;
    }

    .section-line {
      width: 60px;
      height: 2px;
      background: #c9a84c;
      margin: 0 auto 3rem;
    }

    /* ── MEMORIAS IUS ── */
    #memorias {
      background: #0a0a18;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-card {
      background: #13132a;
      border: 1px solid #c9a84c44;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .video-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(201,168,76,0.2);
    }

    .video-card .card-label {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 1rem;
    }

    .instagram-embed-wrapper {
      width: 100%;
      min-height: 480px;
      display: flex;
      justify-content: center;
    }

    .instagram-embed-wrapper blockquote.instagram-media {
      min-width: 0 !important;
      width: 100% !important;
    }

    /* ── PLACEHOLDER BOXES ── */
    #seccion-a, #seccion-b {
      background: #0d0d1a;
    }

    #seccion-b {
      background: #0a0a18;
    }

    .box-placeholder {
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid #c9a84c44;
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      background: #13132a;
      color: #a08040;
      font-size: 1rem;
      letter-spacing: 0.1em;
    }

    /* ── FOOTER ── */
    footer {
      background: #06060f;
      text-align: center;
      padding: 2rem;
      color: #a08040;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      border-top: 1px solid #c9a84c33;
    }
  </style>
</head>
<body>

  <!-- ── HERO ── -->
  <header class="hero">
    <p class="hero-label">Ius et Veritas</p>
    <h1 class="hero-title">
      ANIVERSARIO 36
      <span>IUS ET VERITAS</span>
    </h1>
    <p class="hero-subtitle">36 Años de Mística</p>
    <div class="divider"></div>
  </header>

  <!-- ── MEMORIAS IUS ── -->
  <section id="memorias">
    <h2 class="section-title">Memorias IUS</h2>
    <div class="section-line"></div>

    <div class="cards-grid">

      <div class="video-card">
        <p class="card-label">Recuerdo I</p>
        <div class="instagram-embed-wrapper">
          <blockquote
            class="instagram-media"
            data-instgrm-captioned
            data-instgrm-permalink="https://www.instagram.com/reel/DQ9P56sjfp-/"
            data-instgrm-version="14"
            style="background:#FFF;border:0;border-radius:3px;box-shadow:0 0 1px 0 rgba(0,0,0,.5),0 1px 10px 0 rgba(0,0,0,.15);margin:1px;max-width:540px;min-width:326px;padding:0;width:calc(100% - 2px);">
          </blockquote>
        </div>
      </div>

      <div class="video-card">
        <p class="card-label">Recuerdo II</p>
        <div class="instagram-embed-wrapper">
          <blockquote
            class="instagram-media"
            data-instgrm-captioned
            data-instgrm-permalink="https://www.instagram.com/reel/DRXRNWtjckP/"
            data-instgrm-version="14"
            style="background:#FFF;border:0;border-radius:3px;box-shadow:0 0 1px 0 rgba(0,0,0,.5),0 1px 10px 0 rgba(0,0,0,.15);margin:1px;max-width:540px;min-width:326px;padding:0;width:calc(100% - 2px);">
          </blockquote>
        </div>
      </div>

      <div class="video-card">
        <p class="card-label">Recuerdo III</p>
        <div class="instagram-embed-wrapper">
          <blockquote
            class="instagram-media"
            data-instgrm-captioned
            data-instgrm-permalink="https://www.instagram.com/reel/DRIhjDpje67/"
            data-instgrm-version="14"
            style="background:#FFF;border:0;border-radius:3px;box-shadow:0 0 1px 0 rgba(0,0,0,.5),0 1px 10px 0 rgba(0,0,0,.15);margin:1px;max-width:540px;min-width:326px;padding:0;width:calc(100% - 2px);">
          </blockquote>
        </div>
      </div>

    </div>
  </section>

  <!-- ── SECCIÓN ADICIONAL A ── -->
  <section id="seccion-a">
    <h2 class="section-title">Sección A</h2>
    <div class="section-line"></div>
    <div class="box-placeholder">
      Contenido por agregar
    </div>
  </section>

  <!-- ── SECCIÓN ADICIONAL B ── -->
  <section id="seccion-b">
    <h2 class="section-title">Sección B</h2>
    <div class="section-line"></div>
    <div class="box-placeholder">
      Contenido por agregar
    </div>
  </section>

  <footer>
    &copy; 2026 · Ius et Veritas · 36 Años de Mística
  </footer>

  <!-- Instagram embed script -->
  <script async src="https://www.instagram.com/embed.js"></script>

</body>
</html>
